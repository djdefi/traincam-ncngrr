---
- name: Ensure train group exists
  ansible.builtin.group:
    name: "{{ traincam_group }}"
    state: present

- name: Ensure train user exists
  ansible.builtin.user:
    name: "{{ traincam_user }}"
    group: "{{ traincam_group }}"
    groups: video
    append: true
    create_home: yes
    state: present

- name: Create bin directory
  ansible.builtin.file:
    path: "{{ traincam_bin_dir }}"
    state: directory
    owner: "{{ traincam_user }}"
    group: "{{ traincam_group }}"
    mode: '0755'

- name: Create config directory
  ansible.builtin.file:
    path: "{{ traincam_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create log directory
  ansible.builtin.file:
    path: "{{ traincam_log_dir }}"
    state: directory
    owner: "{{ traincam_user }}"
    group: "{{ traincam_group }}"
    mode: '0755'

- name: Deploy udev dma_heap rule
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-dma-heap.rules
    content: 'SUBSYSTEM=="dma_heap",GROUP="video",MODE="0660"'
    owner: root
    group: root
    mode: '0644'
  notify: Reload udev rules

- name: Ensure runtime packages installed
  ansible.builtin.package:
    name:
      - avahi-daemon
      - ffmpeg
    state: present
  become: true

- name: Download mediamtx archive
  ansible.builtin.get_url:
    url: "{{ mediamtx_download_url }}"
    dest: /tmp/mediamtx.tar.gz
    checksum: "{{ mediamtx_checksum }}"
    mode: '0644'
  register: mediamtx_download

- name: Extract mediamtx binary
  ansible.builtin.unarchive:
    src: /tmp/mediamtx.tar.gz
    dest: /usr/local/bin
    remote_src: true
    creates: /usr/local/bin/mediamtx
  when: mediamtx_download is changed
  notify: Restart mediamtx

- name: Deploy stream script
  ansible.builtin.template:
    src: stream.sh.j2
    dest: "{{ traincam_bin_dir }}/stream.sh"
    owner: "{{ traincam_user }}"
    group: "{{ traincam_group }}"
    mode: '0755'
  notify: Restart traincam

- name: Deploy RTSP publish script
  ansible.builtin.template:
    src: publish.sh.j2
    dest: "{{ traincam_bin_dir }}/publish.sh"
    owner: "{{ traincam_user }}"
    group: "{{ traincam_group }}"
    mode: '0755'
  notify: Restart traincam

- name: Deploy stream configuration
  ansible.builtin.template:
    src: stream.conf.j2
    dest: "{{ traincam_config_dir }}/stream.conf"
    owner: root
    group: root
    mode: '0644'
  notify: Restart traincam

- name: Deploy tuning file patcher
  ansible.builtin.copy:
    src: patch_tuning.py
    dest: "{{ traincam_bin_dir }}/patch_tuning.py"
    owner: root
    group: root
    mode: '0755'

- name: Generate camera tuning file
  ansible.builtin.command:
    argv:
      - "{{ traincam_bin_dir }}/patch_tuning.py"
      - "{{ traincam_tuning_source }}"
      - "{{ traincam_tuning_file }}"
      - "{{ traincam_agc_shutter | to_json }}"
      - "{{ traincam_agc_gain | to_json }}"
  register: traincam_tuning_result
  changed_when: "'changed' in traincam_tuning_result.stdout"
  notify: Restart traincam

- name: Deploy systemd unit
  ansible.builtin.template:
    src: traincam.service.j2
    dest: "{{ traincam_unit_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart traincam

- name: Create mediamtx config directory
  ansible.builtin.file:
    path: /etc/mediamtx
    state: directory
    owner: "{{ traincam_user }}"
    group: "{{ traincam_group }}"
    mode: '0755'

- name: Deploy mediamtx configuration
  ansible.builtin.template:
    src: mediamtx.yml.j2
    dest: /etc/mediamtx/mediamtx.yml
    owner: "{{ traincam_user }}"
    group: "{{ traincam_group }}"
    mode: '0644'
  notify: Restart mediamtx

- name: Deploy mediamtx service unit
  ansible.builtin.template:
    src: mediamtx.service.j2
    dest: /etc/systemd/system/mediamtx.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart mediamtx

- name: Ensure mediamtx service enabled and started
  ansible.builtin.systemd:
    name: mediamtx.service
    enabled: true
    state: started
    daemon_reload: true

- name: Ensure traincam service enabled and started
  ansible.builtin.systemd:
    name: "{{ traincam_service_name }}.service"
    enabled: true
    state: started
    daemon_reload: true

- name: Create viewer web directory
  ansible.builtin.file:
    path: /home/{{ traincam_user }}/www
    state: directory
    owner: "{{ traincam_user }}"
    group: "{{ traincam_group }}"
    mode: '0755'

- name: Deploy WebRTC viewer page
  ansible.builtin.template:
    src: viewer.html.j2
    dest: /home/{{ traincam_user }}/www/viewer.html
    owner: "{{ traincam_user }}"
    group: "{{ traincam_group }}"
    mode: '0644'

- name: Deploy viewer server
  ansible.builtin.copy:
    src: viewer_server.py
    dest: "{{ traincam_bin_dir }}/viewer_server.py"
    owner: "{{ traincam_user }}"
    group: "{{ traincam_group }}"
    mode: '0755'
  notify: Restart viewer

- name: Remove untracked discovery server
  ansible.builtin.file:
    path: "{{ traincam_bin_dir }}/discovery_server.py"
    state: absent
  notify: Restart viewer

- name: Advertise TrainCam via mDNS
  ansible.builtin.template:
    src: traincam-avahi.service.j2
    dest: /etc/avahi/services/traincam.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Avahi

- name: Deploy viewer http service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/traincam-viewer.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=TrainCam viewer server
      After=network-online.target avahi-daemon.service
      Wants=avahi-daemon.service
      StartLimitIntervalSec=0
      StartLimitBurst=0

      [Service]
      Type=simple
      User={{ traincam_user }}
      Group={{ traincam_group }}
      WorkingDirectory=/home/{{ traincam_user }}/www
      ExecStart=/usr/bin/python3 {{ traincam_bin_dir }}/viewer_server.py {{ traincam_viewer_port | default(8080) }} {{ traincam_port | default(8554) }} {{ traincam_webrtc_port | default(8889) }}
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target
  notify: Restart viewer

- name: Ensure viewer service enabled and started
  ansible.builtin.systemd:
    name: traincam-viewer.service
    enabled: true
    state: started
    daemon_reload: true

- name: Remove obsolete NetworkManager override
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d/10-wifi-roaming.conf
    state: absent

# Configure WiFi network priorities (traincameranet as primary)
- name: Set traincameranet WiFi priority
  ansible.builtin.command:
    cmd: nmcli connection modify preconfigured connection.autoconnect-priority 5
  changed_when: false
  failed_when: false

- name: Boot without the unused desktop
  ansible.builtin.file:
    src: /lib/systemd/system/multi-user.target
    dest: /etc/systemd/system/default.target
    state: link
    force: true

- name: Disable console auto-login
  ansible.builtin.file:
    path: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    state: absent

- name: Read installed services
  ansible.builtin.service_facts:

- name: Disable unused headless services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - bluetooth.service
    - cups-browsed.service
    - cups.service
    - hciuart.service
    - lightdm.service
    - ModemManager.service
    - wayvnc-control.service
    - wayvnc.service
  when: item in ansible_facts.services

- name: Disable unused headless hardware
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - regexp: '^dtparam=audio='
      line: 'dtparam=audio=off'
    - regexp: '^dtparam=hdmi='
      line: 'dtparam=hdmi=off'
    - regexp: '^enable_tvout='
      line: 'enable_tvout=0'
    - regexp: '^dtoverlay=disable-bt$'
      line: 'dtoverlay=disable-bt'
  loop_control:
    label: "{{ item.line }}"
